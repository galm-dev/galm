<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GALM — AI infrastructure for global trade</title>
<meta name="description" content="GALM is building an AI layer for cross-border commerce. Document intelligence, container tracking, and a copilot that ties it all together." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lenis@1/dist/lenis.min.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isTouch = window.matchMedia('(pointer: coarse)').matches;

    if (reduceMotion || isTouch || !window.Lenis) return;

    let lenis = null;
    let rafId = 0;

    const getScrubBounds = () => {
      const hero = document.querySelector('.hero');
      if (!hero) return null;

      const rect = hero.getBoundingClientRect();
      const scrollY = window.scrollY || window.pageYOffset || 0;
      const height = hero.offsetHeight;
      const vh = window.innerHeight || 1;
      const span = Math.max(height - vh, 1);
      const curtainStart = Math.max(0, Math.min(1, (height - 2 * vh) / span));
      const videoEnd = curtainStart + (1 - curtainStart);

      return {
        start: rect.top + scrollY,
        end: rect.top + scrollY + span * videoEnd,
      };
    };

    const isInScrub = () => {
      const bounds = getScrubBounds();
      if (!bounds) return false;
      const y = window.scrollY || window.pageYOffset || 0;
      return y >= bounds.start && y <= bounds.end;
    };

    const destroyLenis = () => {
      if (!lenis) return;
      lenis.destroy();
      lenis = null;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
      window.__GALM_LENIS__ = null;
    };

    const ensureLenis = () => {
      if (lenis) return;
      lenis = new Lenis({
        duration: 0.85,
        easing: (t) => 1 - Math.pow(1 - t, 3),
        smoothWheel: true,
        wheelMultiplier: 1.18,
        touchMultiplier: 1,
        infinite: false,
      });
      window.__GALM_LENIS__ = lenis;
      if (!rafId) rafId = requestAnimationFrame(raf);
    };

    const syncLenisState = () => {
      if (isInScrub()) ensureLenis();
      else destroyLenis();
    };

    function raf(time) {
      if (!lenis) {
        rafId = 0;
        return;
      }
      if (!isInScrub()) {
        destroyLenis();
        return;
      }
      lenis.raf(time);
      rafId = requestAnimationFrame(raf);
    }

    window.addEventListener('scroll', syncLenisState, { passive: true });
    window.addEventListener('resize', syncLenisState);
    syncLenisState();

    document.querySelectorAll('a[href^="#"]').forEach((a) => {
      a.addEventListener('click', (e) => {
        const href = a.getAttribute('href');
        if (!href || href === '#') return;
        const target = document.querySelector(href);
        if (!target) return;
        e.preventDefault();
        if (lenis) {
          lenis.scrollTo(target, { offset: 0, duration: 0.8 });
        } else {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  });
</script>

<script src="i18n.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
